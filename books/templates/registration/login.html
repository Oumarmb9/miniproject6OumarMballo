{% extends "base.html" %}
{% block title %}Log In &middot; BookNook{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h1 class="h3 mb-4">Log in</h1>
        {% if form.errors %}
          <div class="alert alert-danger">Your username and password didn't match. Please try again.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
            <input type="text" name="username" id="{{ form.username.id_for_label }}"
                   class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
            <input type="password" name="password" id="{{ form.password.id_for_label }}"
                   class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
        <p class="mt-3 mb-0 text-center">
          No account yet? <a href="{% url 'register' %}">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
